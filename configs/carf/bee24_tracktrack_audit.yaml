dataset:
  name: BEE24
  root: ${BEE24_ROOT}
  split: development_core
  split_manifest: configs/carf/manifests/bee24_carf_v2.yaml
  gt_root: ${BEE24_ROOT}/train

experiment:
  # Set true only after all choices are frozen on project_train/development_core.
  frozen: false

inputs:
  # topic_cache consumes TOPICTrack/cache/det_*.pkl and
  # TOPICTrack/cache/embeddings/{sequence}_embedding.pkl read-only.
  format: topic_cache
  detections: ${BEE24_DETECTIONS}
  reid_features: ${BEE24_REID_FEATURES}
  detector_checkpoint: ${BEE24_DET_CKPT}
  reid_checkpoint: ${BEE24_REID_CKPT}
  topic_adapter:
    input_size: [800, 1440]
    area_range: [432, 10710]
    score_floor: 0.4
    embedding_split: 0.6

tracker:
  # Frozen TrackTrack parameters. Do not tune these on official_test.
  min_len: 3
  min_box_area: 10
  max_time_lost: 60
  penalty_p: 0.20
  penalty_q: 0.40
  reduce_step: 0.05
  tai_thr: 0.55
  det_thr: 0.60
  init_thr: 0.60
  match_thr: 0.80
  cmc:
    # TrackTrack ships no BEE24 GMC file; identity is the frozen BEE24 baseline.
    identity: true
    root: ${BEE24_CMC_ROOT}

carf:
  enabled: true
  policy: audit_only
  rollback_writes: [1, 3]
  soft_power: 1.0
  log_schema: carf.audit.v2

oracle:
  label: "OFFLINE ORACLE - NOT A DEPLOYABLE METHOD: online GT identity anchor"
  iou_threshold: 0.5

evaluation:
  enabled: true
  benchmark: BEE24
  do_preproc: false

postprocess:
  enabled: false

output:
  root: ${OUTPUT_ROOT}
