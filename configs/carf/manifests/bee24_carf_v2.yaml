schema_version: carf.split.v2
dataset: BEE24
source:
  videos: 36
  official_test_source: TOPICTrack/results/gt/seqmaps/BEE24-val.txt
  note: Sequence IDs use the exact TOPIC cache spelling without hyphens.

# Minimal real-data Gate 0 only. BEE2414 is deliberately excluded: its raw
# training GT contains conflicting boxes with the same (frame, identity), so it
# is not valid MOTChallenge/TrackEval input. Gate 0 never rewrites GT identities.
gate0:
  - BEE2406

# Chosen development mechanisms; this is not described as a 20% validation split.
development_core:
  - BEE2406
  - BEE2410
  - BEE2426
  - BEE2429

development_long: []

# Convenience union for the online Oracle experiment.
oracle_development:
  - BEE2406
  - BEE2410
  - BEE2426
  - BEE2429

# Raw annotations are not valid MOT evaluation targets because distinct boxes
# share a (frame, identity) pair. Counts from the frozen full-train preflight:
# BEE2414=1, BEE2415=1, BEE2433=959, BEE2435=36. Never repair these by deleting
# a box or inventing a new identity.
excluded_non_trackeval:
  - BEE2414
  - BEE2415
  - BEE2433
  - BEE2435

stress_dense_long: []

